[project]
name = "hotel-assistance"
version = "0.1.0"
description = "AI-assisted hotel search filter parser: converts natural-language hotel requests into structured search-state updates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "openai>=1.68",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/hotel_assistance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend"]
markers = [
    "integration: talks to a real external service; excluded from the default run",
]
addopts = "-m 'not integration'"
